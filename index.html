<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Tic-Tac-Toe</title>
    <link rel="stylesheet" href="style.css">
    <script src="script.js" defer></script>
</head>
<body>
    <button class="play">play</button>
    <button class="reset">reset</button>
    <div class="main">
    <div class="display"></div>
   <div class="board">
  <div class="cell" data-index="0"><span class="mark"></span></div>
<div class="cell" data-index="1"><span class="mark"></span></div>
<div class="cell" data-index="2"><span class="mark"></span></div>
<div class="cell" data-index="3"><span class="mark"></span></div>
<div class="cell" data-index="4"><span class="mark"></span></div>
<div class="cell" data-index="5"><span class="mark"></span></div>
<div class="cell" data-index="6"><span class="mark"></span></div>
<div class="cell" data-index="7"><span class="mark"></span></div>
<div class="cell" data-index="8"><span class="mark"></span></div>
<svg class="win-line" viewBox="0 0 300 300">
    <!-- Rows -->
    <line class="line row-0" x1="20" y1="50" x2="280" y2="50"/>
    <line class="line row-1" x1="20" y1="150" x2="280" y2="150"/>
    <line class="line row-2" x1="20" y1="250" x2="280" y2="250"/>

    <!-- Columns -->
    <line class="line col-0" x1="50" y1="20" x2="50" y2="280"/>
    <line class="line col-1" x1="150" y1="20" x2="150" y2="280"/>
    <line class="line col-2" x1="250" y1="20" x2="250" y2="280"/>

    <!-- Diagonals -->
    <line class="line diag-0" x1="20" y1="20" x2="280" y2="280"/>
    <line class="line diag-1" x1="280" y1="20" x2="20" y2="280"/>
</svg>
</div> 
</body>
</html>
